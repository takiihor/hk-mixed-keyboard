name: Android quality gates

on:
  pull_request:
  push:
    branches: [main, master, "release/**"]

permissions:
  contents: read

jobs:
  unit-lint-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests and lint
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - name: Corpus integrity and tooling
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q corpus/tools/tests
          python3 corpus/tools/verify_corpus_manifest.py
      - name: Manifest privacy guard
        run: |
          ! rg -n 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          rg -n 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-lint-reports
          if-no-files-found: warn
          path: |
            android/app/build/reports/
            android/app/build/test-results/

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: API 35 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Archive instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
